name: Compilar VideoCutter

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  pruebas-motor:
    # Prueba el motor (cortar, recodificar, unir...) con FFmpeg real
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: dotnet run --project VideoCutter-proyecto/tests/CoreTests -c Release

  programa-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Compilar el .exe (no hace falta tener .NET instalado para usarlo)
        run: >
          dotnet publish VideoCutter-proyecto/src/App/App.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: VideoCutter-Windows
          path: publish/VideoCutter.exe
